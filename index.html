ds become when they retire.","Being {name} is a full-time occupation.","The floor has never let me down. Except the stairs.","A quiet day can still contain a very important crumb.","I wonder who decided that ceilings should be so far away.","My tail is following me again. A loyal friend."],hungry:["My whiskers suspect a snack somewhere.","An empty bowl is a question with a delicious answer.","I could eat a mountain. A small, rat-sized mountain.","The air smells almost edible today.","I shall inspect the kitchen situation. From this room.","Surely there is a crumb the humans have overlooked.","My tummy has submitted a tiny suggestion.","Is it lunchtime? I accept approximate answers."],sleepy:["I am not yawning. I am testing my face.","This corner has excellent pillow potential.","Dreaming is exploring with your paws switched off.","I shall close my eyes to hear the room better.","The blanket understands me completely.","Five more minutes. Possibly six small ones.","My tail is already asleep. I should catch up.","A good nap makes room for tomorrow’s discoveries."],curious:["Something is different. It might be everything.","What is behind that? And behind the behind?","A mysterious smell deserves a careful nose.","If I stand taller, perhaps the answers are up there.","The world keeps leaving clues at whisker height.","I shall investigate with both ears.","That object has been suspiciously interesting all morning.","I wonder whether humans can smell a new idea."],happy:["All four paws agree: this is a lovely day.","Nothing needs fixing in this particular moment.","A soft rug and a safe corner. Quite a fortune.","My ears feel especially round today.","If contentment had a shape, it would be this loaf.","I have everything I need within sniffing distance.","There is a little sunshine inside my tummy.","Life is good when your favorite box is still a box."],window:["The outside is a very large room with no roof.","A bird! Such extravagant front paws.","The window keeps the wind in its own room.","Perhaps the clouds are carrying snacks somewhere.","That tree is waving. I shall twitch an ear back.","So much world. I will start with this windowsill.","The horizon seems a little beyond my jumping range.","Watching is a perfectly respectable adventure."],rain:["The sky is washing its whiskers.","Every raindrop has somewhere very urgent to be.","The window is making tiny rivers for tiny boats.","I like rain best when I am made of dry fur.","The world sounds like it is quietly applauding.","Perhaps puddles are the sky’s spare windows.","A rainy day is excellent weather for a cardboard house.","That drop won the race. I was rooting for it."],night:["The moon is a crumb someone forgot to finish.","At night, even the furniture whispers.","The fairy lights are very well-behaved fireflies.","Darkness makes a small room feel wonderfully secret.","I can hear the house getting comfortable.","Stars would be easier to count if I had more toes.","The lamp has saved a little piece of sunset.","Good evening, shadows. Please mind my tail."],petted:["Ah. You found the excellent spot.","I shall pretend I did not lean into that.","My ears have temporarily become soft little pancakes.","Some conversations require no squeaks at all.","Yes, this is very good weather for head scratches.","I feel like a warm sock full of happiness.","A gentle hand is a lovely place to rest a thought.","Official verdict from {name}: please continue."],exploring:["This corner has changed since my last inspection. Emotionally.","Under the bed is an entirely separate country.","I leave no interesting gap unsniffed.","The rug is a forest if you keep your eyes low.","A brave explorer always checks the return route.","I have discovered the back of something.","Every journey begins with a very serious nose.","Map update: here is still here. Promising."],eating:["A tiny feast deserves both paws.","This is the most important thing happening in my mouth.","I shall enjoy this one crumb at a time.","My paws are excellent cutlery.","A snack tastes better after a little expedition.","I was going to save some. An ambitious plan.","The crunch is part of the recipe.","Dear snack: thank you for being here."],missing:["The room is quiet. I shall provide the tiny footsteps.","I wonder what interesting corners you are finding.","There is always a warm place here for a familiar voice.","I can keep myself quite busy with this piece of paper.","Perhaps you are having a snack too. A nice thought.","The world is full of things to tell you about later.","I am collecting peaceful moments today.","We can enjoy the same moon from different windows."],welcome:["There you are. Come see my very ordinary, wonderful corner.","Welcome back. The rug remains excellent.","A familiar presence. My favorite kind of surprise.","You arrived just in time for absolutely nothing urgent.","I have made several discoveries. Mostly cardboard.","Hello again. Shall we listen to the room together?","{name} reporting: all corners are accounted for.","A little visit makes the whole room warmer."]}},Te={ui:{title:"Il piccolo mondo di un ratto",subtitle:"Una piccola vita. Un mondo intero.",feed:"Lascia uno spuntino",pet:"Una carezza",call:"Chiama {name}",weather:"Meteo",settings:"Piccole preferenze",sound:"Audio",close:"Chiudi",name:"Il nome del tuo ratto",language:"Lingua",music:"Musica delicata",quality:"Dettaglio animazioni",time:"Ora del giorno",reduced:"Movimento ridotto",sfx:"Piccoli suoni",ambience:"Suoni della stanza",auto:"L’orologio di questo mondo",local:"La tua ora locale",day:"Luce del giorno",sunset:"Ora dorata",night:"Chiaro di luna",clear:"Sereno",rain:"Pioggia",cloudy:"Nuvole",snow:"Neve",high:"Ricco",low:"Leggero",skip:"Salta l’introduzione",intro:"Da qualche parte, in un angolo tranquillo del mondo, una piccolissima avventura si sta svegliando.",description:"Una camera accogliente illustrata dove un piccolo ratto domestico esplora, riposa, mangia e condivide qualche pensiero. Usa erfetto.","Farò finta di non essermi avvicinato apposta.","Le mie orecchie sono diventate due morbide frittelline.","Certe conversazioni non hanno bisogno di squittii.","Sì, è il clima ideale per i grattini sulla testa.","Mi sento come un calzino caldo pieno di felicità.","Una mano gentile è un bel posto dove posare un pensiero.","Verdetto ufficiale di {name}: continua pure."],exploring:["Questo angolo è cambiato dall’ultimo controllo. Emotivamente.","Sotto il letto è un paese completamente diverso.","Non lascio nessuna fessura interessante senza annusarla.","Il tappeto è una foresta se tieni gli occhi bassi.","Un esploratore coraggioso controlla sempre la via del ritorno.","Ho scoperto il retro di qualcosa.","Ogni viaggio comincia con un naso molto serio.","Aggiornamento della mappa: qui è ancora qui. Promettente."],eating:["Un piccolo banchetto merita entrambe le zampe.","Questa è la cosa più importante che succede nella mia bocca.","Me la godrò una briciola alla volta.","Le mie zampe sono ottime posate.","Uno spuntino è più buono dopo una piccola spedizione.","Volevo conservarne un po’. Un piano ambizioso.","Lo scricchiolio fa parte della ricetta.","Caro spuntino, grazie di essere qui."],missing:["La stanza è silenziosa. Ai passettini ci penso io.","Chissà quali angoli interessanti stai scoprendo.","Qui c’è sempre un posto caldo per una voce familiare.","Posso tenermi parecchio occupato con questo pezzetto di carta.","Forse anche tu stai facendo merenda. Un bel pensiero.","Il mondo è pieno di cose da raccontarti più tardi.","Oggi colleziono momenti tranquilli.","Possiamo goderci la stessa luna da finestre diverse."],welcome:["Eccoti. Vieni a vedere il mio normalissimo, meraviglioso angolo.","Bentornato. Il tappeto resta eccellente.","Una presenza familiare. La mia sorpresa preferita.","Sei arrivato giusto in tempo per niente di urgente.","Ho fatto diverse scoperte. Soprattutto di cartone.","Ciao di nuovo. Ascoltiamo la stanza insieme?","Rapporto di {name}: tutti
